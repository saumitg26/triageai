<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Presage</title>
<style>body{font:16px/1.6 system-ui;background:#0f172a;color:#e2e8f0;max-width:520px;margin:12vh auto;padding:24px}h1{font-size:30px}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #475569;border-radius:8px;background:#1e293b;color:white;font-size:16px;margin:10px 0 20px}button,a{background:#14b8a6;color:#062b28;border:0;border-radius:8px;padding:12px 18px;font:inherit;cursor:pointer}small{display:block;color:#94a3b8;margin:16px 0}#message{margin-top:20px}</style>
<h1>Connect Presage</h1><p>Copy your active API key from the Presage dashboard, then paste it here.</p>
<form id="setup"><label for="key">Presage API key</label><input id="key" type="password" autocomplete="off" required spellcheck="false"><button id="save">Save key locally</button></form>
<small>The key is saved in this project's private .env file on this computer. It is excluded from Git. Saving the key does not start the camera or verify your subscription.</small><p id="message" role="status"></p>
<script>
document.getElementById('setup').addEventListener('submit',async event=>{event.preventDefault();const button=document.getElementById('save');const message=document.getElementById('message');button.disabled=true;try{const response=await fetch('/presage/configure',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:document.getElementById('key').value.trim()})});if(!response.ok)throw new Error(await response.text());document.getElementById('key').value='';message.textContent='Key saved. Return to the intake page to try a scan.';const link=document.createElement('a');link.href='/';link.textContent='Open intake app';message.append(document.createElement('br'),link);}catch(error){message.textContent=error.message;}finally{button.disabled=false;}});
</script></html>
